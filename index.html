<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Финансы</title>
<style>
  body{font-family:-apple-system;background:#0b0b0f;color:#fff;margin:0;padding:20px;font-size:18px}
  #debug{background:#fbbf24;color:#000;padding:12px;font-size:14px;font-family:monospace;border-radius:8px;margin-bottom:16px;word-break:break-all}
  button{font-size:20px;padding:16px;border-radius:12px;border:0;background:#22d17a;color:#000;font-weight:600;margin:4px 0;width:100%}
  input{font-size:18px;padding:12px;border-radius:10px;border:1px solid #333;background:#222;color:#fff;width:100%;box-sizing:border-box;margin:4px 0}
  .item{padding:12px;border-bottom:1px solid #333;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div id="debug">JS НЕ ЗАПУСТИЛСЯ</div>
<h2 id="month">Загрузка...</h2>
<div id="bal" style="font-size:36px;font-weight:700;margin:16px 0">0 ₽</div>
<input id="amount" type="number" inputmode="decimal" placeholder="Сумма">
<input id="note" placeholder="Комментарий">
<button onclick="addOp('expense')">− Расход</button>
<button onclick="addOp('income')">+ Доход</button>
<h3 style="margin-top:24px">Операции</h3>
<div id="list"></div>

<script>
var dbg = document.getElementById('debug');
dbg.textContent = 'JS стартовал.';

try {
  var ops = [];
  try {
    var saved = localStorage.getItem('finance_v1');
    if(saved){
      var parsed = JSON.parse(saved);
      if(parsed && Array.isArray(parsed.operations)) ops = parsed.operations;
    }
  } catch(e){ ops = []; }
  dbg.textContent = 'Данные: ' + ops.length + ' операций.';

  function fmt(n){
    return (Math.round(n*100)/100).toLocaleString('ru-RU') + ' ₽';
  }
  function today(){ return new Date().toISOString().slice(0,10); }
  function month(){ return today().slice(0,7); }

  function addOp(type){
    var amt = parseFloat(document.getElementById('amount').value);
    if(!amt || amt <= 0){ alert('Введи сумму'); return; }
    ops.push({
      id: 'o' + Date.now(),
      type: type,
      amount: amt,
      note: document.getElementById('note').value,
      date: today()
    });
    try {
      localStorage.setItem('finance_v1', JSON.stringify({operations: ops}));
    } catch(e){}
    document.getElementById('amount').value = '';
    document.getElementById('note').value = '';
    render();
  }

  function render(){
    var m = month();
    var mOps = ops.filter(function(o){ return o.date.slice(0,7) === m; });
    var inc = 0, exp = 0;
    mOps.forEach(function(o){
      if(o.type === 'income') inc += o.amount;
      else exp += o.amount;
    });
    document.getElementById('month').textContent = new Date().toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
    document.getElementById('bal').textContent = (inc - exp).toLocaleString('ru-RU') + ' ₽';
    var html = '';
    mOps.slice().reverse().forEach(function(o){
      var sign = o.type === 'income' ? '+' : '−';
      var color = o.type === 'income' ? '#22d17a' : '#ff5a5f';
      html += '<div class="item"><span>' + (o.note || (o.type==='income'?'Доход':'Расход')) + '</span>'
        + '<span style="color:' + color + '">' + sign + ' ' + o.amount + ' ₽</span></div>';
    });
    document.getElementById('list').innerHTML = html || '<div style="color:#666">Пусто</div>';
    dbg.textContent = 'Работает. Операций: ' + ops.length;
    dbg.style.background = '#22d17a';
  }

  render();
  dbg.textContent = 'Загружено. Операций: ' + ops.length;
  dbg.style.background = '#22d17a';
} catch(e){
  dbg.textContent = 'ОШИБКА: ' + e.message;
  dbg.style.background = '#ff5a5f';
  dbg.style.color = '#fff';
}
</script>
</body>
</html>
