<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0f">
<title>Финансы</title>
<style>
  :root{
    --bg:#0b0b0f; --bg2:#141420; --card:#1c1c28; --line:#26263a;
    --text:#f5f5fa; --muted:#7c7c92;
    --green:#22d17a; --red:#ff5a5f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
    background:var(--bg); color:var(--text);
    padding-top:env(safe-area-inset-top);
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
  }
  #err{
    position:fixed;top:0;left:0;right:0;background:#b91c1c;color:#fff;
    padding:10px;font-size:12px;font-family:monospace;z-index:9999;display:none;
    word-break:break-all;
  }
  #ver{
    position:fixed;top:8px;right:8px;font-size:10px;color:#3a3a4a;z-index:5;
  }
  .top{padding:16px 20px 20px}
  .month-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .month-row .title{font-size:15px;font-weight:600;text-transform:capitalize}
  .month-row .arrow{
    width:34px;height:34px;border-radius:50%;background:var(--bg2);
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:20px;cursor:pointer;user-select:none;
  }
  .big-sum{font-size:44px;font-weight:700;letter-spacing:-1.5px;line-height:1;margin-bottom:18px}
  .big-sum .cur{font-size:26px;color:var(--muted);font-weight:600;margin-left:4px}
  .big-sum.neg{color:var(--red)}
  .in-out{display:flex;gap:26px;font-size:14px}
  .in-out .item{display:flex;align-items:center;gap:6px}
  .in-out .dot{width:8px;height:8px;border-radius:50%}
  .in-out .green .dot{background:var(--green)}
  .in-out .red .dot{background:var(--red)}
  .in-out .val{color:var(--muted)}
  .in-out .green .val{color:var(--green);font-weight:600}
  .in-out .red .val{color:var(--red);font-weight:600}
  .daygroup{padding:0 20px;margin-bottom:4px}
  .daygroup .dayhead{font-size:12px;color:var(--muted);letter-spacing:.4px;margin:16px 0 6px;font-weight:500}
  .op{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .op:last-child{border-bottom:0}
  .op .ic{
    width:38px;height:38px;border-radius:50%;background:var(--bg2);
    display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto;
  }
  .op .mid{flex:1;min-width:0}
  .op .mid .n{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .op .mid .n b{color:#fff;font-weight:700}
  .op .mid .c{font-size:12px;color:var(--muted);margin-top:2px}
  .op .amt{font-size:15px;font-weight:600;text-align:right;white-space:nowrap}
  .op .amt.red{color:var(--red)}
  .op .amt.green{color:var(--green)}
  .empty{color:var(--muted);text-align:center;padding:48px 20px;font-size:14px;line-height:1.6}
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;
    background:rgba(11,11,15,.94);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--line);
    display:flex;justify-content:space-around;align-items:flex-end;
    padding:8px 0 calc(6px + env(safe-area-inset-bottom));
    z-index:50;
  }
  .tabbar .tb{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:4px 0;cursor:pointer;color:var(--muted);font-size:10px;
    background:none;border:0;font-family:inherit;
  }
  .tabbar .tb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar .tb.active{color:var(--text)}
  .tabbar .tb.add{flex:0 0 auto}
  .tabbar .tb.add .circle{
    width:50px;height:50px;border-radius:50%;background:var(--green);
    display:flex;align-items:center;justify-content:center;
    font-size:28px;color:#04120a;font-weight:300;
    box-shadow:0 6px 20px rgba(34,209,122,.4);margin-top:-16px;line-height:1;
  }
  .screen{display:none;padding:16px 20px 20px}
  .screen.on{display:block}
  .screen h2{font-size:24px;margin:4px 0 18px;font-weight:700;letter-spacing:-.5px}
  .card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .muted{color:var(--muted);font-size:13px}
  button{
    background:var(--green);color:#04120a;border:0;border-radius:12px;
    padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  button.ghost{background:var(--bg2);color:var(--text)}
  button.danger{background:transparent;color:var(--red)}
  input,select{
    width:100%;background:var(--bg2);border:1px solid var(--line);
    color:var(--text);border-radius:12px;padding:12px;font-size:16px;
    margin-bottom:10px;font-family:inherit;
  }
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
  .hidden{display:none}
  canvas{max-width:100%}
  .chart-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .legend{font-size:13px;flex:1;min-width:140px}
  .legend div{display:flex;align-items:center;gap:6px;margin:4px 0}
  .dotc{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .bar{height:6px;background:var(--bg2);border-radius:4px;overflow:hidden;margin-top:6px}
  .bar>div{height:100%;background:var(--green);transition:width .3s}
  .bar.warn>div{background:#fbbf24}
  .bar.over>div{background:var(--red)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:100}
  .modal.show{display:flex}
  .sheet{
    background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;
    padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;
  }
  .sheet h2{margin:0 0 16px;font-size:18px}
</style>
</head>
<body>

<div id="err" onclick="this.style.display='none'"></div>
<div id="ver">v10</div>

<div id="screen-home" class="screen on" style="padding:0">
  <div class="top">
    <div class="month-row">
      <div class="arrow" onclick="shiftMonth(-1)">‹</div>
      <div class="title" id="monthLabel">—</div>
      <div class="arrow" onclick="shiftMonth(1)">›</div>
    </div>
    <div class="big-sum" id="bigSum">0<span class="cur">₽</span></div>
    <div class="in-out">
      <div class="item green"><span class="dot"></span><span>Доходы</span><span class="val" id="inSum">0 ₽</span></div>
      <div class="item red"><span class="dot"></span><span>Расходы</span><span class="val" id="outSum">0 ₽</span></div>
    </div>
  </div>
  <div id="opsByDay"></div>
</div>

<div id="screen-stats" class="screen">
  <h2>Аналитика</h2>
  <div class="card">
    <div class="muted" style="margin-bottom:10px">Расходы по категориям</div>
    <div class="chart-wrap">
      <canvas id="pie" width="160" height="160"></canvas>
      <div class="legend" id="pieLegend"></div>
    </div>
  </div>
  <div class="card">
    <div class="muted" style="margin-bottom:8px">Сводка месяца</div>
    <div id="summary" style="font-size:14px;line-height:1.9"></div>
  </div>
</div>

<div id="screen-budget" class="screen">
  <h2>Бюджет</h2>
  <div class="card">
    <div class="row" style="margin-bottom:12px">
      <b>Лимиты на месяц</b>
      <button class="ghost" style="padding:6px 12px;font-size:13px" onclick="openBudgetEdit()">Изменить</button>
    </div>
    <div id="budgetList"></div>
  </div>
</div>

<div id="screen-more" class="screen">
  <h2>Ещё</h2>
  <div class="card">
    <b>Счета</b>
    <div id="accountsList" style="margin-top:8px"></div>
    <button class="ghost" style="margin-top:10px;width:100%" onclick="openAccountEdit()">+ Добавить счёт</button>
  </div>
  <div class="card">
    <b>Категории</b>
    <div id="catsList" style="margin-top:8px"></div>
    <button class="ghost" style="margin-top:10px;width:100%" onclick="openCatEdit()">+ Добавить категорию</button>
  </div>
  <div class="card">
    <b>Данные</b>
    <div class="muted" style="margin:8px 0">Хранится только на этом устройстве.</div>
    <button class="ghost" style="width:100%;margin-bottom:8px" onclick="exportData()">Экспорт (JSON)</button>
    <button class="ghost" style="width:100%;margin-bottom:8px" onclick="document.getElementById('importFile').click()">Импорт</button>
    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
    <button class="danger" style="width:100%;margin-top:8px;border:1px solid var(--line)" onclick="resetAll()">Сбросить всё</button>
  </div>
</div>

<div class="tabbar">
  <button class="tb active" data-tab="home" onclick="switchTab('home')">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
    <span>Главная</span>
  </button>
  <button class="tb" data-tab="stats" onclick="switchTab('stats')">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span>Анализ</span>
  </button>
  <button class="tb add" onclick="openOpEdit()">
    <div class="circle">+</div>
  </button>
  <button class="tb" data-tab="budget" onclick="switchTab('budget')">
    <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h2"/></svg>
    <span>Бюджет</span>
  </button>
  <button class="tb" data-tab="more" onclick="switchTab('more')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
    <span>Ещё</span>
  </button>
</div>

<div class="modal" id="opModal">
  <div class="sheet">
    <h2 id="opTitle">Новая операция</h2>
    <input type="hidden" id="opId">
    <label>Тип</label>
    <select id="opType"><option value="expense">Расход</option><option value="income">Доход</option></select>
    <label>Сумма</label>
    <input type="number" id="opAmount" inputmode="decimal" placeholder="0" step="0.01">
    <label>Категория</label>
    <select id="opCat"></select>
    <label>Счёт</label>
    <select id="opAccount"></select>
    <label>Дата</label>
    <input type="date" id="opDate">
    <label>Комментарий</label>
    <input type="text" id="opNote" placeholder="необязательно">
    <div class="row" style="margin-top:14px">
      <button class="danger hidden" id="opDelete" onclick="deleteOp()">Удалить</button>
      <div style="flex:1"></div>
      <button class="ghost" onclick="closeModal('opModal')">Отмена</button>
      <button onclick="saveOp()">Сохранить</button>
    </div>
  </div>
</div>

<div class="modal" id="catModal">
  <div class="sheet">
    <h2>Новая категория</h2>
    <label>Название</label>
    <input type="text" id="catName" placeholder="Например: Продукты">
    <label>Иконка (эмодзи)</label>
    <input type="text" id="catIcon" value="📁" maxlength="2">
    <label>Тип</label>
    <select id="catType"><option value="expense">Расход</option><option value="income">Доход</option></select>
    <div class="row" style="margin-top:14px">
      <button class="ghost" onclick="closeModal('catModal')">Отмена</button>
      <button onclick="saveCat()">Сохранить</button>
    </div>
  </div>
</div>

<div class="modal" id="accountModal">
  <div class="sheet">
    <h2>Новый счёт</h2>
    <label>Название</label>
    <input type="text" id="accName" placeholder="Например: Карта">
    <label>Начальный баланс</label>
    <input type="number" id="accBalance" inputmode="decimal" value="0" step="0.01">
    <div class="row" style="margin-top:14px">
      <button class="ghost" onclick="closeModal('accountModal')">Отмена</button>
      <button onclick="saveAccount()">Сохранить</button>
    </div>
  </div>
</div>

<div class="modal" id="budgetModal">
  <div class="sheet">
    <h2>Лимиты бюджета</h2>
    <div id="budgetEditList"></div>
    <div class="row" style="margin-top:14px">
      <button class="ghost" onclick="closeModal('budgetModal')">Отмена</button>
      <button onclick="saveBudget()">Сохранить</button>
    </div>
  </div>
</div>

<script>
window.onerror = function(msg, src, line){
  var e = document.getElementById('err');
  if(e){
    e.style.display = 'block';
    e.textContent = 'Ошибка (стр.' + line + '): ' + msg;
  }
  return false;
};

var DEFAULT = {
  accounts: [{id:'a1', name:'Наличные', balance:0}],
  categories: [
    {id:'c1',  name:'Продукты',    icon:'🛒', type:'expense'},
    {id:'c2',  name:'Транспорт',   icon:'🚇', type:'expense'},
    {id:'c3',  name:'Кафе',        icon:'☕️', type:'expense'},
    {id:'c4',  name:'Жильё',       icon:'🏠', type:'expense'},
    {id:'c5',  name:'Здоровье',    icon:'💊', type:'expense'},
    {id:'c6',  name:'Развлечения', icon:'🎬', type:'expense'},
    {id:'c7',  name:'Одежда',      icon:'👕', type:'expense'},
    {id:'c8',  name:'Связь',       icon:'📱', type:'expense'},
    {id:'c9',  name:'Прочее',      icon:'📦', type:'expense'},
    {id:'c10', name:'Зарплата',    icon:'💼', type:'income'},
    {id:'c11', name:'Подработка',  icon:'💡', type:'income'},
    {id:'c12', name:'Подарок',     icon:'🎁', type:'income'}
  ],
  operations: [],
  budget: {},
  currency: '₽'
};

function clone(o){ return JSON.parse(JSON.stringify(o)); }

function load(){
  try{
    var raw = localStorage.getItem('finance_v1');
    if(!raw) return clone(DEFAULT);
    var d = JSON.parse(raw);
    var res = Object.assign(clone(DEFAULT), d);
    if(!Array.isArray(res.operations)) res.operations = [];
    if(!Array.isArray(res.categories) || !res.categories.length) res.categories = clone(DEFAULT.categories);
    if(!Array.isArray(res.accounts) || !res.accounts.length) res.accounts = clone(DEFAULT.accounts);
    if(!res.budget || typeof res.budget !== 'object') res.budget = {};
    if(typeof res.currency !== 'string') res.currency = '₽';
    return res;
  }catch(e){ return clone(DEFAULT); }
}
var DB = load();

function save(){
  try{ localStorage.setItem('finance_v1', JSON.stringify(DB)); }
  catch(e){}
}

function $(s){ return document.querySelector(s); }

function fmt(n){
  if(typeof n !== 'number' || isNaN(n)) n = 0;
  return (Math.round(n*100)/100).toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:2}) + ' ' + DB.currency;
}

function monthKey(d){ return String(d).slice(0,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

function getAccount(id){
  for(var i=0;i<DB.accounts.length;i++) if(DB.accounts[i].id===id) return DB.accounts[i];
  return {name:'—'};
}
function getCat(id){
  for(var i=0;i<DB.categories.length;i++) if(DB.categories[i].id===id) return DB.categories[i];
  return {name:'—',icon:'📁',type:'expense'};
}
function isSplitCat(c){ return c && c.name === 'Прочее'; }

var curMonth = todayISO().slice(0,7);

function shiftMonth(delta){
  var p = curMonth.split('-');
  var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1+delta, 1);
  curMonth = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  renderHome();
}
function monthLabelRu(mk){
  var p = mk.split('-');
  var s = new Date(parseInt(p[0],10), parseInt(p[1],10)-1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function dayLabelRu(iso){
  var today = todayISO();
  var yest = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(iso === today) return 'Сегодня';
  if(iso === yest) return 'Вчера';
  var d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'});
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}
function groupKey(o){
  var c = getCat(o.catId);
  if(isSplitCat(c) && o.note && o.note.trim()){
    return o.catId + '::' + o.note.trim().toLowerCase();
  }
  return o.catId;
}
function labelFromKey(key){
  if(key.indexOf('::') >= 0){
    var parts = key.split('::');
    var c = getCat(parts[0]);
    return { icon: c.icon, name: c.name + ' · ' + parts[1] };
  }
  var c = getCat(key);
  return { icon: c.icon, name: c.name };
}

function renderHome(){
  $('#monthLabel').textContent = monthLabelRu(curMonth);
  var mOps = DB.operations.filter(function(o){ return monthKey(o.date) === curMonth; });
  var inc = 0, exp = 0;
  mOps.forEach(function(o){
    if(o.type === 'income') inc += o.amount;
    else exp += o.amount;
  });
  var net = inc - exp;

  var big = $('#bigSum');
  big.innerHTML = (net<0?'−':'') + Math.abs(net).toLocaleString('ru-RU',{maximumFractionDigits:2}) + '<span class="cur">' + DB.currency + '</span>';
  big.className = 'big-sum' + (net<0?' neg':'');

  $('#inSum').textContent = fmt(inc);
  $('#outSum').textContent = fmt(exp);

  var byDay = {};
  mOps.forEach(function(o){
    if(!byDay[o.date]) byDay[o.date] = [];
    byDay[o.date].push(o);
  });
  var days = Object.keys(byDay).sort().reverse();
  if(!days.length){
    $('#opsByDay').innerHTML = '<div class="empty">Пока нет операций за этот месяц.<br>Нажми «+» внизу, чтобы добавить.</div>';
    return;
  }
  var html = '';
  days.forEach(function(day){
    html += '<div class="daygroup">';
    html += '<div class="dayhead">' + dayLabelRu(day) + '</div>';
    byDay[day].slice().sort(function(a,b){ return String(b.id).localeCompare(String(a.id)); }).forEach(function(o){
      var c = getCat(o.catId);
      var acc = getAccount(o.accountId).name;
      var sign = o.type === 'income' ? '+' : '−';
      var cls = o.type === 'income' ? 'green' : 'red';
      var title;
      if(isSplitCat(c) && o.note && o.note.trim()){
        title = c.name + ' · <b>' + escapeHtml(o.note) + '</b>';
      } else {
        title = o.note ? escapeHtml(o.note) : c.name;
      }
      html += '<div class="op" onclick="openOpEdit(\'' + o.id + '\')">'
        + '<div class="ic">' + c.icon + '</div>'
        + '<div class="mid"><div class="n">' + title + '</div>'
        + '<div class="c">' + c.name + ' · ' + acc + '</div></div>'
        + '<div class="amt ' + cls + '">' + sign + fmt(o.amount) + '</div>'
        + '</div>';
    });
    html += '</div>';
  });
  $('#opsByDay').innerHTML = html;
}

function switchTab(name){
  var screens = document.querySelectorAll('.screen');
  for(var i=0;i<screens.length;i++) screens[i].classList.remove('on');
  var tabs = document.querySelectorAll('.tabbar .tb');
  for(var j=0;j<tabs.length;j++) tabs[j].classList.remove('active');
  var scr = document.getElementById('screen-' + name);
  if(scr) scr.classList.add('on');
  var tb = document.querySelector('.tabbar .tb[data-tab="' + name + '"]');
  if(tb) tb.classList.add('active');
  window.scrollTo(0,0);
  if(name === 'stats') renderStats();
  if(name === 'budget') renderBudget();
  if(name === 'more') renderMore();
}

function renderStats(){
  var ops = DB.operations.filter(function(o){ return o.type==='expense' && monthKey(o.date)===curMonth; });
  var byGroup = {};
  ops.forEach(function(o){
    var k = groupKey(o);
    byGroup[k] = (byGroup[k] || 0) + o.amount;
  });
  var entries = Object.keys(byGroup).map(function(k){ return [k, byGroup[k]]; })
    .sort(function(a,b){ return b[1] - a[1]; });
  var total = entries.reduce(function(s,e){ return s + e[1]; }, 0);

  var canvas = $('#pie');
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,160,160);
  var colors = ['#22d17a','#4b8dff','#fbbf24','#ff5a5f','#a78bfa','#f472b6','#34d399','#fb923c','#22d3ee','#94a3b8'];
  if(total === 0){
    ctx.fillStyle = '#26263a';
    ctx.beginPath(); ctx.arc(80,80,70,0,Math.PI*2); ctx.fill();
  } else {
    var start = -Math.PI/2;
    entries.forEach(function(e,i){
      var a = e[1]/total * Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(80,80);
      ctx.arc(80,80,70,start,start+a);
      ctx.closePath();
      ctx.fillStyle = colors[i%colors.length];
      ctx.fill();
      start += a;
    });
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(80,80,38,0,Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }

  $('#pieLegend').innerHTML = entries.length ? entries.map(function(e,i){
    var lb = labelFromKey(e[0]);
    return '<div><span class="dotc" style="background:' + colors[i%colors.length] + '"></span>'
      + lb.icon + ' ' + escapeHtml(lb.name) + ' — ' + fmt(e[1])
      + ' (' + (e[1]/total*100).toFixed(0) + '%)</div>';
  }).join('') : '<div class="muted">Нет расходов в этом месяце</div>';

  var inc = 0;
  DB.operations.forEach(function(o){
    if(o.type==='income' && monthKey(o.date)===curMonth) inc += o.amount;
  });
  var avg = ops.length ? total/ops.length : 0;
  var top = entries[0] ? labelFromKey(entries[0][0]).name : '—';
  $('#summary').innerHTML =
    '💸 Расходов: <b>' + fmt(total) + '</b><br>'
  + '💰 Доходов: <b>' + fmt(inc) + '</b><br>'
  + '📊 Остаток: <b>' + fmt(inc-total) + '</b><br>'
  + '🧾 Средний чек: <b>' + fmt(avg) + '</b><br>'
  + '🥇 Топ: <b>' + escapeHtml(top) + '</b><br>'
  + '📅 Операций: <b>' + ops.length + '</b>';
}

function renderBudget(){
  var spent = {};
  DB.operations.forEach(function(o){
    if(o.type==='expense' && monthKey(o.date)===curMonth){
      spent[o.catId] = (spent[o.catId]||0) + o.amount;
    }
  });
  var budgeted = DB.categories.filter(function(c){ return c.type==='expense' && DB.budget[c.id] > 0; });
  if(!budgeted.length){
    $('#budgetList').innerHTML = '<div class="empty">Лимиты не заданы.<br>Нажми «Изменить».</div>';
    return;
  }
  $('#budgetList').innerHTML = budgeted.map(function(c){
    var limit = DB.budget[c.id];
    var used = spent[c.id] || 0;
    var pct = Math.min(100, used/limit*100);
    var cls = used > limit ? 'over' : (pct > 80 ? 'warn' : '');
    return '<div style="margin:14px 0">'
      + '<div class="row"><span>' + c.icon + ' ' + c.name + '</span>'
      + '<span class="muted">' + fmt(used) + ' / ' + fmt(limit) + '</span></div>'
      + '<div class="bar ' + cls + '"><div style="width:' + pct + '%"></div></div>'
      + '</div>';
  }).join('');
}
function openBudgetEdit(){
  $('#budgetEditList').innerHTML = DB.categories.filter(function(c){ return c.type==='expense'; }).map(function(c){
    return '<label>' + c.icon + ' ' + c.name + '</(clabel>'
      + '<input type="number" data-bcat="' + c.id + '" value="' + (DB.budget[c.id]||'') + '" placeholder="0" inputmode="decimal">';
  }).join('');
  $('#budgetModal').classList.add('show');
}
function saveBudget(){
  DB.budget = {};
  var inputs = document.querySelectorAll('#budgetEditList input[data-bcat]');
  for(var i=0;i<inputs.length;i++){
    var v = parseFloat(inputs[i].value);
    if(v > 0) DB.budget[inputs[i].getAttribute('data-bcat')] = v;
  }
  save(); closeModal('budgetModal'); renderBudget();
}

function accountBalance(accId){
  var acc = getAccount(accId);
  if(!acc || !acc.id) return 0;
  var b = acc.balance || 0;
  DB.operations.forEach(function(o){
    if(o.accountId !== accId) return;
    b += o.type === 'income' ? o.amount : -o.amount;
  });
  return b;
}

function renderMore(){
  $('#accountsList').innerHTML = DB.accounts.map(function(a){
    return '<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)">'
      + '<span>' + escapeHtml(a.name) + '</span>'
      + '<span class="muted">' + fmt(accountBalance(a){
.id   )) + '</span></div>';
  }).join('');
 return  $('#catsList').innerHTML = DB.categories '<.map(functiondiv class="row" style="padding:8px 0;border-bottom:1px solid var(--line)">'
      + '<span>' + c.icon + ' ' + escapeHtml(c.name) + '</span>'
      + '<span class="muted">' + (c.type === 'income' ? 'доход' : 'расход') + '</span></div>';
  }).join('');
}
function openCatEdit(){
  $('#catName').value='';
  $('#catIcon').value='📁';
  $('#catModal').classList.add('show');
}
function saveCat(){
  var name = $('#catName').value.trim();
  if(!name) return alert('Введи название');
  DB.categories.push({id:'c'+Date.now(), name:name, icon:$('#catIcon').value||'📁', type:$('#catType').value});
  save(); closeModal('catModal'); renderMore();
}
function openAccountEdit(){
  $('#accName').value='';
  $('#accBalance').value='0';
  $('#accountModal').classList.add('show');
}
function saveAccount(){
  var name = $('#accName').value.trim();
  if(!name) return alert('Введи название');
  DB.accounts.push({id:'a'+Date.now(), name:name, balance:parseFloat($('#accBalance').value)||0});
  save(); closeModal('accountModal'); renderMore();
}

function openOpEdit(id){
  $('#opType').value='expense';
  $('#opAmount').value='';
  $('#opDate').value = todayISO();
  $('#opNote').value='';
  $('#opId').value='';
  $('#opTitle').textContent='Новая операция';
  $('#opDelete').classList.add('hidden');
  fillSelects();
  if(id){
    var o = null;
    for(var i=0;i<DB.operations.length;i++){ if(DB.operations[i].id===id){ o = DB.operations[i]; break; } }
    if(!o) return;
    $('#opId').value = o.id;
    $('#opType').value = o.type;
    $('#opAmount').value = o.amount;
    $('#opDate').value = o.date;
    $('#opNote').value = o.note||'';
    $('#opTitle').textContent = 'Операция';
    $('#opDelete').classList.remove('hidden');
    fillSelects();
    $('#opCat').value = o.catId;
    $('#opAccount').value = o.accountId;
  }
  $('#opModal').classList.add('show');
}
function fillSelects(){
  var type = $('#opType').value;
  $('#opCat').innerHTML = DB.categories.filter(function(c){ return c.type===type; }).map(function(c){
    return '<option value="' + c.id + '">' + c.icon + ' ' + escapeHtml(c.name) + '</option>';
  }).join('');
  $('#opAccount').innerHTML = DB.accounts.map(function(a){
    return '<option value="' + a.id + '">' + escapeHtml(a.name) + '</option>';
  }).join('');
}
document.getElementById('opType').onchange = fillSelects;

function saveOp(){
  var amt = parseFloat($('#opAmount').value);
  if(!amt || amt<=0) return alert('Введи корректную сумму');
  var id = $('#opId').value;
  var data = {
    type: $('#opType').value,
    amount: amt,
    catId: $('#opCat').value,
    accountId: $('#opAccount').value,
    date: $('#opDate').value || todayISO(),
    note: $('#opNote').value.trim()
  };
  if(id){
    for(var k=0;k<DB.operations.length;k++){
      if(DB.operations[k].id===id){
        DB.operations[k] = Object.assign(DB.operations[k], data);
        break;
      }
    }
  } else {
    DB.operations.push(Object.assign({id:'o'+Date.now()}, data));
  }
  save(); closeModal('opModal'); switchTab('home');
}
function deleteOp(){
  var id = $('#opId').value;
  if(!id) return;
  if(!confirm('Удалить операцию?')) return;
  DB.operations = DB.operations.filter(function(o){ return o.id!==id; });
  save(); closeModal('opModal'); switchTab('home');
}
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

document.querySelectorAll('.modal').forEach(function(m){
  m.addEventListener('click', function(e){
    if(e.target===m) m.classList.remove('show');
  });
});

function exportData(){
  var blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'finance-backup-' + todayISO() + '.json';
  a.click();
}
function importData(e){
  var f = e.target.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      DB = Object.assign(DB, JSON.parse(r.result));
      save(); alert('Импортировано'); location.reload();
    }catch(err){ alert('Ошибка файла'); }
  };
  r.readAsText(f);
}
function resetAll(){
  if(!confirm('Удалить все данные?')) return;
  localStorage.clear();
  location.reload();
}

try { renderHome(); } catch(e){ }
